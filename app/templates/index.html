<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Auto Job Apply System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        form {
            margin-bottom: 30px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-top: 10px;
        }
        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }
        button {
            margin-top: 15px;
            padding: 10px 15px;
            background-color: #0077cc;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #005fa3;
        }
        .message {
            color: green;
        }
        .section {
            margin-bottom: 40px;
        }
        .uploaded-files ul {
            list-style: none;
            padding-left: 0;
        }
        .uploaded-files li {
            padding: 5px 0;
        }
        .top-right {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 250px;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <div class="top-right">
        <h3>Job Filters</h3>
        <form action="/save_filters" method="POST">
            <label>Job Title</label>
            <input type="text" name="title" required>

            <label>Location</label>
            <input type="text" name="location" required>

            <label>Keywords</label>
            <input type="text" name="keywords" placeholder="comma-separated">

            <button type="submit">Save Filters</button>
        </form>
        {% if filter_message %}
            <p class="message">{{ filter_message }}</p>
        {% endif %}
    </div>

    <div class="container">
        <h1>Welcome to Auto Job Apply</h1>

        <div class="section">
            <h2>Upload Resume & Cover Letter</h2>
            <form action="/upload" method="POST" enctype="multipart/form-data">
                <label>Select Resume</label>
                <input type="file" name="resume" required>

                <label>Select Cover Letter</label>
                <input type="file" name="cover_letter">

                <button type="submit">Upload Files</button>
            </form>

            {% if message %}
                <p class="message">{{ message }}</p>
            {% endif %}
        </div>

        <div class="section uploaded-files">
            <h2>Uploaded Files</h2>
            <ul>
                {% for file in files %}
                    <li>{{ file }}</li>
                {% else %}
                    <li>No files uploaded yet.</li>
                {% endfor %}
            </ul>
        </div>

        <div class="section">
            <a href="/jobs"><button>View Matching Jobs</button></a>
        </div>
    </div>
</body>
</html>
